# Comparison variant of ffhq_custom.yml with beta_schedule set to "linear"
# instead of "cosine" -- same reasoning as ckpts/ddpm/configs/anime_linear.yml
# (see diagnostics/outputs/step_c3/training_config_consistency.md:
# ~/improved-diffusion/run_train.sh used --noise_schedule linear).
# Added as a new file so ffhq_custom.yml itself stays untouched pending
# approval of the proposed fix in diagnostics/outputs/summary_report_stepC.md.
#
# Use with: --source_model_type ffhq_custom_linear --source_model_path <path>

data:
    dataset: "CUSTOM_FACE256"
    image_size: 256
    channels: 3

diffusion:
    beta_schedule: "linear"
    beta_start: 0.0001
    beta_end: 0.02
    num_diffusion_timesteps: 1000
