version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: cyclediffusion:latest
    container_name: cyclediffusion-container
    volumes:
      - .:/app
      - /mnt/NAS/vr:/mnt/NAS/vr:ro
    environment:
      - CUDA_VISIBLE_DEVICES=0
      - CUDA_LAUNCH_BLOCKING=1
      - WANDB_MODE=offline
      - WANDB_API_KEY=${WANDB_API_KEY:-}
      - RUN_NAME=translate_ffhq256_to_anime256_eta001_fbsdiff_1000stp_wvloss001
      - SEED=42
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['${GPU_ID:-2}']
              capabilities: [gpu]
    ipc: host # Important for multiprocessing/DDP
    stdin_open: true
    tty: true
    working_dir: /app
    command: >
      bash -c "python -m torch.distributed.launch
      --nproc_per_node 1
      --master_port 1446
      main.py
      --seed 42
      --cfg experiments/translate_ffhq256_to_anime256_ddim_eta01.cfg
      --run_name $$RUN_NAME
      --logging_strategy steps
      --logging_first_step true
      --logging_steps 4
      --evaluation_strategy steps
      --eval_steps 50
      --metric_for_best_model CLIPEnergy
      --greater_is_better false
      --save_intermediate True
      --intermediate_dir ./debug/$$RUN_NAME
      --save_strategy steps
      --save_steps 50
      --save_total_limit 1
      --load_best_model_at_end
      --gradient_accumulation_steps 4
      --num_train_epochs 0
      --adafactor false
      --learning_rate 1e-3
      --do_eval
      --output_dir output/$$RUN_NAME
      --overwrite_output_dir
      --per_device_train_batch_size 1
      --per_device_eval_batch_size 1
      --eval_accumulation_steps 4
      --ddp_find_unused_parameters true
      --verbose true
      --eta 0.001
      --use_freeinv True
      --freeinv_seed 42
      --use_fbsdiff False
      --fbsdiff_cutoff 0.3
      --fbsdiff_start_step 0
      --fbsdiff_end_step 30
      --fbsdiff_cache_every 1"
  app-wavelet:
    build:
      context: .
      dockerfile: Dockerfile
    image: cyclediffusion:latest
    container_name: cyclediffusion-container
    volumes:
      - .:/app
      - /mnt/NAS/vr:/mnt/NAS/vr:ro
    environment:
      - CUDA_VISIBLE_DEVICES=0
      - CUDA_LAUNCH_BLOCKING=1
      - WANDB_MODE=offline
      - WANDB_API_KEY=${WANDB_API_KEY:-}
      - RUN_NAME=${RUN_NAME:-translate_ffhq256_to_anime256_10000_eta0001_free_inv_fbsdiff010_100stp_100stp_020rstp_wvloss001}
      - SEED=42
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['${GPU_ID:-2}']
              capabilities: [gpu]
    ipc: host # Important for multiprocessing/DDP
    stdin_open: true
    tty: true
    working_dir: /app
    command: >
      bash -c "python -m torch.distributed.launch
      --nproc_per_node 1
      --master_port 1446
      main.py
      --seed 42
      --cfg experiments/translate_ffhq256_to_anime256_ddim_eta01_wvloss.cfg
      --run_name $$RUN_NAME
      --logging_strategy steps
      --logging_first_step true
      --logging_steps 4
      --evaluation_strategy steps
      --eval_steps 50
      --metric_for_best_model CLIPEnergy
      --greater_is_better false
      --save_intermediate True
      --intermediate_dir ./debug/optimize_wvloss/$$RUN_NAME
      --save_strategy steps
      --save_steps 50
      --save_total_limit 1
      --load_best_model_at_end
      --gradient_accumulation_steps 4
      --num_train_epochs 0
      --adafactor false
      --learning_rate 1e-3
      --do_eval
      --output_dir output/optimize_wvloss/$$RUN_NAME
      --overwrite_output_dir
      --per_device_train_batch_size 1
      --per_device_eval_batch_size 1
      --eval_accumulation_steps 4
      --ddp_find_unused_parameters true
      --verbose false
      --eta 0.001
      --use_freeinv True
      --freeinv_seed 42
      --use_fbsdiff True
      --fbsdiff_cutoff $${FBSDIFF_CUTOFF:-0.1}
      --fbsdiff_start_step 0
      --fbsdiff_end_step $${FBSDIFF_END_STEP:-100}
      --fbsdiff_cache_every 1"